<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140a3d">
<title>Ти з 2000-х?</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💿</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400..900;1,700..900&family=Tektur:wght@400..900&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#07041a; --bg1:#140a3d;
  --win-bg:#f0edfb; --ink:#1a1233; --ink2:#4a4270;
  --ui:"Exo 2", Tahoma, Verdana, sans-serif;
  --pixel:"Tektur", "Courier New", monospace;
  --lcd:"Tektur", "Courier New", monospace;
  --chrome:"Unbounded", "Arial Black", sans-serif;
  --mx:0; --my:0;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; color:#fff; font-family:var(--ui);
  background:
    radial-gradient(1100px 650px at 50% -12%, #3d1ba3 0%, transparent 62%),
    radial-gradient(800px 600px at 105% 105%, #1b2a8a 0%, transparent 60%),
    radial-gradient(700px 500px at -5% 80%, #2a1070 0%, transparent 60%),
    linear-gradient(180deg, var(--bg1), var(--bg0));
  background-attachment:fixed;
}
button{font-family:inherit}
.hide{display:none!important}

/* ---------- background: stars, bubbles, sparkles ---------- */
#stars,#orbs{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; transition:transform .4s ease-out}
#stars{transform:translate(calc(var(--mx)*-22px),calc(var(--my)*-22px))}
#orbs{transform:translate(calc(var(--mx)*-55px),calc(var(--my)*-55px))}
#stars i{position:absolute; border-radius:50%; background:#fff; box-shadow:0 0 6px #b596ff; animation:tw 3s ease-in-out infinite}
#stars b{position:absolute; color:#d9ccff; font-size:14px; font-weight:400; text-shadow:0 0 8px #8a5cff; animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2; transform:scale(.7)} 50%{opacity:1; transform:scale(1.15)}}
#orbs i{position:absolute; bottom:-160px; border-radius:50%; opacity:.6;
  background:radial-gradient(circle at 30% 26%, rgba(255,255,255,.9) 0 6%, rgba(255,255,255,.16) 14%, rgba(var(--c),.08) 40%, rgba(var(--c),.3) 67%, rgba(255,255,255,.35) 70%, transparent 72%);
  animation:rise var(--d) linear infinite; animation-delay:var(--dl)}
@keyframes rise{0%{transform:translate(0,0)} 50%{transform:translate(var(--sx),-65vh)} 100%{transform:translate(0,-140vh)}}
.spark{position:fixed; pointer-events:none; z-index:9999; transform:translate(-50%,-50%); animation:spark .8s ease-out forwards; text-shadow:0 0 6px currentColor}
@keyframes spark{to{transform:translate(-50%,calc(-50% + 26px)) scale(.3) rotate(90deg); opacity:0}}
.burst{position:fixed; pointer-events:none; z-index:9999; font-size:15px; transform:translate(-50%,-50%); animation:burst .7s ease-out forwards; text-shadow:0 0 8px currentColor}
@keyframes burst{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2) rotate(180deg); opacity:0}}
.confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:60}

/* ---------- type ---------- */
.chrome{
  font-family:var(--chrome); font-weight:900; line-height:1.02; letter-spacing:-.5px; margin:0;
  background:
    linear-gradient(105deg,transparent 40%,rgba(255,255,255,.95) 49%,rgba(201,240,255,.9) 51%,transparent 60%) no-repeat,
    linear-gradient(180deg,#ffffff 0%,#f1efff 28%,#aca6d9 47%,#3d2d8a 50%,#6b5bc4 60%,#d8d2ff 82%,#ffffff 100%);
  background-size:260% 100%,100% 100%; background-position:160% 0,0 0;
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 2px 0 #2a0f86) drop-shadow(0 0 14px rgba(138,92,255,.75));
  animation:shine 5s ease-in-out infinite;
}
@keyframes shine{0%,20%{background-position:160% 0,0 0} 70%,100%{background-position:-60% 0,0 0}}
.px{font-family:var(--pixel); font-size:14px; line-height:1.45; letter-spacing:.8px; font-weight:600}
.dim{color:#bfb3ff; opacity:.85}
.dim2{color:#7a7399}
.blink{animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}

/* ---------- layout ---------- */
#app{position:relative; z-index:2}
.screen{max-width:1180px; margin:0 auto; padding:18px 16px 40px}
.enter > *{animation:popin .55s cubic-bezier(.2,1.3,.4,1) both}
.enter > *:nth-child(2){animation-delay:.07s} .enter > *:nth-child(3){animation-delay:.14s}
.enter > *:nth-child(4){animation-delay:.21s} .enter > *:nth-child(5){animation-delay:.28s}
.enter > *:nth-child(6){animation-delay:.35s} .enter > *:nth-child(n+7){animation-delay:.42s}
@keyframes popin{from{opacity:0; transform:translateY(22px) scale(.97)}}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; flex-wrap:wrap}
.linkbtn{background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.28); color:#e2dbff; font:600 13px/1 var(--pixel); letter-spacing:.8px; padding:10px 12px; border-radius:8px; cursor:pointer; transition:background .15s, transform .15s}
.linkbtn:hover{background:rgba(138,92,255,.3); transform:translateY(-1px)}
.row{display:flex; flex-wrap:wrap; align-items:center}
.gap{gap:10px}
.foot{display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:center; margin-top:18px}

/* ---------- XP windows ---------- */
.win{background:var(--win-bg); color:var(--ink); border:1px solid #1f0c6e; border-radius:10px 10px 6px 6px; box-shadow:0 14px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(181,150,255,.25); overflow:hidden; margin-bottom:16px; transition:box-shadow .25s}
.win:hover{box-shadow:0 18px 48px rgba(0,0,0,.6), 0 0 0 1px rgba(181,150,255,.55), 0 0 32px rgba(138,92,255,.3)}
.win-t{display:flex; align-items:center; gap:8px; min-height:34px; padding:3px 5px 3px 12px; color:#fff; font:800 15px/1.2 var(--ui); letter-spacing:.3px; text-shadow:1px 1px 0 #1d0a5a; background:linear-gradient(180deg,#a684ff 0%,#6f3cf5 9%,#5e2be6 45%,#5022d6 86%,#3c16ae 100%)}
.win-t .ttl{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.wb{display:flex; gap:3px; flex:none}
.wb i{width:21px; height:21px; border:1px solid rgba(255,255,255,.85); border-radius:4px; background:linear-gradient(180deg,#a887ff,#5b2ce0); display:grid; place-items:center; font:700 11px/1 var(--ui); color:#fff; font-style:normal}
.win-b{padding:16px; background:linear-gradient(180deg,#f8f6ff,#ebe7fb)}
.win-b.dark{background:linear-gradient(180deg,#1d1446,#0d0826); color:#fff}

/* ---------- glossy buttons ---------- */
.btn{--c1:#c9b0ff;--c2:#8a5cff;--c3:#6a35f0;--c4:#8358ff;--bd:#2a0f86;
  position:relative; overflow:hidden; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 24px; min-height:46px; border-radius:999px; border:1px solid var(--bd); color:#fff;
  font:800 16px/1.1 var(--ui); letter-spacing:.4px; text-shadow:0 1px 0 rgba(20,5,70,.7);
  background:linear-gradient(180deg,var(--c1) 0%,var(--c2) 48%,var(--c3) 52%,var(--c4) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7), inset 0 -2px 6px rgba(20,5,70,.35), 0 4px 16px rgba(106,53,240,.45);
  cursor:pointer; transition:filter .15s, transform .12s; text-align:center}
.btn::before{content:""; position:absolute; left:10%; right:10%; top:2px; height:46%; border-radius:999px; background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.06)); pointer-events:none}
.btn::after{content:""; position:absolute; top:-10%; bottom:-10%; width:34%; left:-60%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent); transform:skewX(-20deg); pointer-events:none}
.btn:hover{filter:brightness(1.12); transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn:disabled{filter:grayscale(.85) brightness(.75); cursor:not-allowed; transform:none}
.btn.big:not(:disabled){animation:breathe 2.6s ease-in-out infinite}
.btn.big:not(:disabled)::after{animation:sweep 3.4s ease-in-out infinite}
.btn:hover:not(:disabled)::after{animation:sweep .8s ease-out}
@keyframes sweep{0%{left:-60%} 45%,100%{left:130%}}
@keyframes breathe{50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.7), inset 0 -2px 6px rgba(20,5,70,.35), 0 4px 32px rgba(138,92,255,.95)}}
.btn.silver{--c1:#ffffff;--c2:#e4e6f0;--c3:#bcc0d3;--c4:#d6d9e6;--bd:#6d7190; color:#241a4d; text-shadow:0 1px 0 #fff; box-shadow:inset 0 1px 0 #fff, inset 0 -2px 6px rgba(40,40,80,.2), 0 4px 14px rgba(0,0,0,.35)}
.btn.lime{--c1:#e6ffc4;--c2:#8fdc3a;--c3:#62b71a;--c4:#7fd12a;--bd:#2f6a08; text-shadow:0 1px 0 #1f4a04; box-shadow:inset 0 1px 0 rgba(255,255,255,.7), inset 0 -2px 6px rgba(20,60,0,.3), 0 4px 16px rgba(98,183,26,.45)}
.btn.big{font-size:19px; padding:15px 32px; min-height:58px}
.btn.sm{font-size:14px; padding:8px 15px; min-height:38px}

/* ---------- title ---------- */
.title-screen{text-align:center; padding-top:5vh}
.tilt{transform:perspective(900px) rotateY(calc(var(--mx)*12deg)) rotateX(calc(var(--my)*-10deg)); transition:transform .25s ease-out}
.hb{color:#e6dcff; font-size:clamp(13px,1.7vw,19px); text-shadow:0 0 10px #8a5cff}
.h1{font-size:clamp(40px,9vw,104px); margin-top:14px; letter-spacing:2px}
.h2{font-size:clamp(58px,15vw,176px); margin-top:0; position:relative; display:inline-block; animation:shine 5s ease-in-out .6s infinite, float 4.5s ease-in-out infinite}
.h2::after{content:"✦"; position:absolute; right:-.3em; top:.02em; font-size:.28em; color:#fff; -webkit-text-fill-color:#fff; filter:none; text-shadow:0 0 12px #b596ff, 0 0 26px #8a5cff; animation:tw 1.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.sub{color:#9fe8ff; margin-top:12px; font-size:clamp(13px,1.6vw,17px)}
.xpboot{width:190px; height:20px; margin:22px auto 0; border:2px solid #b9bdd0; border-radius:5px; background:#05030f; overflow:hidden; position:relative}
.xpboot i{position:absolute; top:2px; width:12px; height:12px; border-radius:2px; background:linear-gradient(180deg,#e0d2ff,#8a5cff 50%,#5a28e0); animation:xpb 1.8s linear infinite}
.xpboot i:nth-child(2){animation-delay:.14s} .xpboot i:nth-child(3){animation-delay:.28s}
@keyframes xpb{0%{left:-40px} 100%{left:200px}}
.hero-btns{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:26px}
.stats{margin-top:16px; color:#bfb3ff; font-size:14px}
.desk{display:flex; justify-content:center; gap:22px; flex-wrap:wrap; margin-top:40px}
.dicon{width:96px; display:flex; flex-direction:column; align-items:center; gap:8px; padding:8px 4px; border:1px solid transparent; border-radius:8px; background:none; color:inherit; cursor:pointer; transition:background .15s, border-color .15s}
.dicon:hover{background:rgba(138,92,255,.2); border-color:rgba(255,255,255,.35)}
.di{font-size:46px; line-height:1; filter:drop-shadow(0 4px 8px rgba(0,0,0,.5)) drop-shadow(0 0 12px rgba(138,92,255,.6)); animation:bob 3s ease-in-out infinite}
.dicon:nth-child(2) .di{animation-delay:.5s} .dicon:nth-child(3) .di{animation-delay:1s} .dicon:nth-child(4) .di{animation-delay:1.5s} .dicon:nth-child(5) .di{animation-delay:2s}
.dicon:hover .di{animation:wiggle .5s ease-in-out}
.dicon.hop .di{animation:hop .65s cubic-bezier(.2,1.6,.4,1)}
.dl{font:600 13px/1.3 var(--ui); color:#fff; text-align:center; text-shadow:1px 1px 0 #000, 0 0 6px #000}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes wiggle{25%{transform:rotate(-10deg) scale(1.08)} 75%{transform:rotate(10deg) scale(1.08)}}
@keyframes hop{30%{transform:translateY(-18px) rotate(-14deg) scale(1.2)} 60%{transform:translateY(0) rotate(8deg)} 100%{transform:none}}

/* ---------- spinning CD ---------- */
.cd{position:relative; width:180px; height:180px; flex:none; border-radius:50%;
  background:radial-gradient(circle,#0d0826 0 11%,#d9dce6 11.5% 15%,rgba(255,255,255,.35) 15.5% 16.5%,transparent 17%),
    conic-gradient(from 0deg,#c3a8ff,#49d6ff,#e6fbff,#8a5cff,#6a35f0,#49d6ff,#ffffff,#b596ff,#c3a8ff);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.85),0 10px 30px rgba(0,0,0,.6),0 0 30px rgba(138,92,255,.6);
  animation:spin 1.4s linear infinite}
.cd i{position:absolute; inset:0; border-radius:50%; background:repeating-radial-gradient(circle,rgba(255,255,255,.1) 0 1px,transparent 1px 4px)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- setup ---------- */
.fld{display:flex; flex-direction:column; gap:6px; font:700 14px var(--ui); color:var(--ink2)}
.fld input,.fld select{font:500 16px var(--ui); padding:10px 12px; border:1px solid #8f88b8; border-radius:6px; background:#fff; color:var(--ink); box-shadow:inset 1px 1px 2px rgba(0,0,0,.15); width:100%}
.fld input:focus,.fld select:focus,.sname:focus,.sstart:focus{outline:2px solid #8a5cff; outline-offset:0}
.info{font:600 15px var(--ui); color:#2f6a08; padding:10px 0}
.chk{display:flex; gap:10px; align-items:flex-start; font:500 15px var(--ui); color:var(--ink); cursor:pointer; grid-column:1/-1}
.chk input{width:18px; height:18px; margin:2px 0 0; accent-color:#6a35f0; flex:none}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.drop{display:flex; align-items:center; gap:16px; padding:18px; border:2px dashed #8a5cff; border-radius:10px; background:repeating-linear-gradient(45deg,#f6f2ff 0 12px,#efe9ff 12px 24px); cursor:pointer; color:var(--ink); font:500 15px/1.4 var(--ui); transition:background-color .2s, border-color .2s, transform .2s}
.drop:hover{border-color:#5a28e0; transform:scale(1.005)}
.drop b{font-weight:800}
.drop span{color:var(--ink2); font-size:14px}
.drop.over{background:#e2d6ff; border-style:solid}
.drop-ic{font-size:44px; animation:spin 3s linear infinite; flex:none}
.drop.over .drop-ic,.drop.busy .drop-ic{animation-duration:.5s}
.note{font:500 14px/1.45 var(--ui); color:var(--ink2); margin-top:10px}
.note.warn{color:#8a4b00; background:#fff4d6; border:1px solid #e8c56a; padding:8px 10px; border-radius:6px}
.note.live{color:#3c16ae; font-weight:700}
.songs{list-style:none; margin:14px 0; padding:0; display:flex; flex-direction:column; gap:6px}
.songs .empty{font:500 15px var(--ui); color:var(--ink2); padding:14px; text-align:center; border:1px dashed #cfc8ee; border-radius:8px}
.song{display:grid; grid-template-columns:34px minmax(0,1fr) 64px auto 34px 34px; grid-template-areas:"n name dur st pv del"; gap:8px; align-items:center; padding:6px 8px; background:#fff; border:1px solid #d8d2f2; border-radius:8px; transition:border-color .15s, box-shadow .15s}
.song:hover{border-color:#8a5cff; box-shadow:0 2px 10px rgba(138,92,255,.2)}
.song:nth-child(even){background:#f6f3ff}
.song .num{grid-area:n; font-size:14px; color:#6a35f0}
.sname{grid-area:name; font:600 15px var(--ui); padding:7px 9px; border:1px solid #d8d2f2; border-radius:6px; min-width:0; width:100%; color:var(--ink); background:#fff}
.song .dur{grid-area:dur; font:600 15px/1 var(--lcd); color:#4a4270; text-align:right; white-space:nowrap}
.song .dur small{display:block; font:600 10px/1.3 var(--ui); color:#8a5cff}
.song .st{grid-area:st; font:500 13px var(--ui); color:#4a4270; display:flex; align-items:center; gap:4px; white-space:nowrap}
.sstart{width:58px; padding:6px; border:1px solid #d8d2f2; border-radius:6px; font:500 14px var(--ui); color:var(--ink)}
.ib{width:34px; height:34px; border-radius:50%; border:1px solid #6d7190; background:linear-gradient(#fff,#d7d9e6); color:#241a4d; font:700 14px/1 var(--ui); cursor:pointer; display:grid; place-items:center; padding:0; transition:transform .12s}
.ib:hover{transform:scale(1.1)}
.ib.on{background:linear-gradient(#c9b0ff,#6a35f0); color:#fff; border-color:#2a0f86}
.ib.del{color:#6a35f0}
.song [data-act="preview"]{grid-area:pv} .song [data-act="delSong"]{grid-area:del}

/* ---------- players (MSN) ---------- */
.msn-head{display:flex; align-items:center; gap:12px; padding-bottom:12px; border-bottom:1px solid #d8d2f2; font:500 16px var(--ui)}
.msn-head b{font-weight:800}
.msn-head .buddy{width:42px; height:42px}
.addp{display:flex; gap:10px; margin-top:14px}
.addp input{flex:1; min-width:0; font:600 17px var(--ui); padding:11px 12px; border:1px solid #8f88b8; border-radius:6px; color:var(--ink)}
.addp input:focus{outline:2px solid #8a5cff}
.plist{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px}
.empty-s{font:500 15px var(--ui); color:#7a7399; padding:6px 2px}
.toast{position:fixed; right:16px; bottom:16px; z-index:80; width:min(280px,calc(100vw - 32px)); animation:toastin .5s cubic-bezier(.2,1.3,.4,1)}
.toast .win{margin:0}
.toast.out{animation:toastout .45s ease-in forwards}
.toast-b{display:flex; gap:12px; align-items:center; font:500 15px/1.35 var(--ui)}
.toast-b b{font-weight:800}
.toast .buddy{width:36px; height:36px}
@keyframes toastin{from{transform:translateY(150%)}} @keyframes toastout{to{transform:translateY(150%)}}

/* ---------- chips ---------- */
.chip{display:inline-flex; align-items:center; gap:8px; max-width:100%; padding:9px 15px 9px 10px; border-radius:999px; border:1px solid #8f93ad; background:linear-gradient(#ffffff,#dfe1ee); font:700 17px/1.1 var(--ui); color:#241a4d; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.18); transition:transform .15s, box-shadow .15s}
.chip > span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.chip:hover{transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.25), 0 0 0 2px rgba(138,92,255,.45)}
.chip:active{transform:scale(.96)}
.chip.y{border-color:#3f7f10; background:linear-gradient(#f5ffe8,#caf59c)}
.chip.static{cursor:default}
.chip.static:hover{transform:none}
.chip .x{margin-left:2px; width:24px; height:24px; border-radius:50%; border:1px solid #9a9fbf; background:#fff; cursor:pointer; font:700 11px/1 var(--ui); color:#6a35f0; flex:none; padding:0}
.chip.pop{animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(.6)} 70%{transform:scale(1.1)} 100%{transform:scale(1)}}
.buddy{flex:none}

/* ---------- round ---------- */
.round-scr{--beat:0}
.round-head{display:flex; align-items:baseline; justify-content:center; gap:14px; margin:4px 0 16px}
.songno{font-size:clamp(42px,7vw,80px); transform:scale(calc(1 + var(--beat)*.06))}
.of{color:#bfb3ff; font-size:clamp(15px,1.8vw,20px)}
.amp{max-width:780px; margin:0 auto 18px; background:linear-gradient(180deg,#3d3c56,#1d1c2c); border:1px solid #0c0b16; border-radius:10px; padding-bottom:14px;
  box-shadow:0 18px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.18), 0 0 calc(10px + 60px*var(--beat)) rgba(138,92,255,calc(.15 + .6*var(--beat)))}
.amp-t{height:24px; display:flex; align-items:center; gap:8px; padding:0 10px; font:600 11px/1 var(--pixel); color:#d6ccff; background:repeating-linear-gradient(180deg,#5a4fa0 0 1px,#2e2860 1px 3px); border-radius:10px 10px 0 0; letter-spacing:1px; white-space:nowrap}
.amp-t .grip{flex:1; height:6px; background:repeating-linear-gradient(90deg,#c9bfff 0 2px,transparent 2px 4px); opacity:.45}
.amp-body{padding:12px 14px 0}
.lcd{display:flex; gap:14px; align-items:center; background:#05030f; border:2px inset #2a2940; border-radius:6px; padding:8px 12px}
.lcd-time{font:600 46px/1 var(--lcd); color:#c9b6ff; text-shadow:0 0 12px rgba(138,92,255,.95); min-width:150px; letter-spacing:1px}
.lcd-r{flex:1; min-width:0}
.marq{overflow:hidden; white-space:nowrap; font:600 17px/1.5 var(--pixel); color:#8ff0ff; text-shadow:0 0 8px rgba(73,214,255,.8)}
.marq span{display:inline-block; padding-left:100%; animation:marq 16s linear infinite}
@keyframes marq{to{transform:translateX(-100%)}}
.lcd-meta{display:flex; gap:12px; margin-top:6px; font:500 12px/1 var(--lcd); letter-spacing:1px; color:#7f76b8; overflow:hidden; white-space:nowrap}
.lcd-meta b{color:#9be83a; font-weight:700; margin-left:auto}
.viz{display:block; width:100%; height:120px; margin-top:12px; background:linear-gradient(180deg,#07051a,#0d0a26); border:1px solid #000; border-radius:4px}

<script>
const CONFIG = {
  BDAY_NAME: 'Роксолана',   // ім'я за замовчуванням (можна змінити в налаштуваннях гри)
  FADE_SEC: 2,              // затухання на початку і в кінці кожної пісні, сек
  VIDEO_KBPS: 160,          // якість mp3, який гра робить із відео
  DRIVE_FOLDER: 'https://drive.google.com/drive/folders/1OLJ_InETKTPLoSFsH7GAdx4KIXESMbhp',   // папка з піснями
  GOOGLE_API_KEY: 'AIzaSyD04csYpu1j3Tv2fo7NwTldUHc0h1vBu6s',   // ключ Google: тільки читання Drive і тільки з адреси гри
};

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = (n, l = 2) => String(n).padStart(l, '0');
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); };
const setText = (el, t) => { if (el && el.textContent !== t) el.textContent = t; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const shuffled = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const app = $('#app');

/* ---------- state (localStorage) ---------- */
const LS_KEY = 'y2k-melody-v1';
const defaults = () => ({ screen: 'title', settings: { bday: CONFIG.BDAY_NAME, clipSec: 30, showAnswer: false, driveUrl: CONFIG.DRIVE_FOLDER }, songs: [], players: [], game: null });
let S = loadState();
function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      return Object.assign(defaults(), s, { settings: Object.assign(defaults().settings, s.settings || {}) });
    }
  } catch (e) {}
  return defaults();
}
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }
const songById = id => S.songs.find(s => s.id === id);

/* ---------- file storage (IndexedDB, fallback to memory) ---------- */
const Store = (() => {
  const mem = new Map(); let dbp = null; let ok = true;
  function open() {
    if (!dbp) dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open('y2k-melody', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('files');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  async function run(mode, fn) {
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction('files', mode); const req = fn(tx.objectStore('files'));
      tx.oncomplete = () => res(req.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  }
  return {
    get persistent() { return ok; },
    async probe() { try { await open(); } catch (e) { ok = false; } },
    async put(k, v) { mem.set(k, v); try { await run('readwrite', s => s.put(v, k)); } catch (e) { ok = false; } },
    async get(k) { if (mem.has(k)) return mem.get(k); try { const v = await run('readonly', s => s.get(k)); if (v) mem.set(k, v); return v; } catch (e) { ok = false; return undefined; } },
    async del(k) { mem.delete(k); try { await run('readwrite', s => s.delete(k)); } catch (e) { ok = false; } },
  };
})();

/* ---------- audio engine: плавне затухання на початку і в кінці ---------- */
const Audio2k = (() => {
  let ctx = null, gain = null, analyser = null, el = null, url = null, timer = null, buf = null;
  let clip = { start: 0, end: 0 }, st = 'idle', ramp = null, key = null, waiters = [];
  const subs = new Set();
  const fadeSec = () => CONFIG.FADE_SEC;
  function set(s) {
    st = s;
    subs.forEach(f => { try { f(s); } catch (e) {} });
    if (s === 'ready' || s === 'idle') { const w = waiters; waiters = []; w.forEach(r => r()); }
  }
  function ensure() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    gain = ctx.createGain(); gain.gain.value = 0;
    analyser = ctx.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.72;
    buf = new Uint8Array(analyser.frequencyBinCount);
    el = new Audio(); el.preload = 'auto';
    ctx.createMediaElementSource(el).connect(gain);
    gain.connect(analyser); analyser.connect(ctx.destination);
    el.addEventListener('ended', () => { if (st !== 'idle' && st !== 'ready') finish(); });
  }
  function unlock() { try { ensure(); if (ctx.state === 'suspended') ctx.resume(); } catch (e) {} }
  function mult() { if (!ramp) return 1; const k = Math.min(1, (performance.now() - ramp.t0) / ramp.ms); return ramp.from + (ramp.to - ramp.from) * k; }
  function setGain(v, instant) {
    const now = ctx.currentTime;
    if (instant) { gain.gain.cancelScheduledValues(now); gain.gain.setValueAtTime(v, now); }
    else gain.gain.setTargetAtTime(v, now, 0.025);
  }
  function tick() {
    if (st !== 'playing' && st !== 'pausing' && st !== 'stopping') return;
    const t = el.currentTime, f = fadeSec();
    if (t >= clip.end - 0.03) { finish(); return; }

    },

  };
})();

const AUDIO_RE = /\.(mp3|m4a|aac|wav|ogg|oga|flac|opus)$/i;
const VIDEO_RE = /\.(mp4|m4v|mov|webm|mkv)$/i;
function fileKind(f) {
  const t = f.type || '';
  if (t.startsWith('audio/')) return 'audio';
  if (t.startsWith('video/')) return 'video';
  if (AUDIO_RE.test(f.name)) return 'audio';
  if (VIDEO_RE.test(f.name)) return 'video';
  return null;
}
let lamePromise = null;
function loadLame() {
  if (window.lamejs && window.lamejs.Mp3Encoder) return Promise.resolve();
  if (!lamePromise) lamePromise = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'vendor/lame.min.js';
    s.onload = res; s.onerror = () => { lamePromise = null; rej(new Error('lame')); };
    document.head.appendChild(s);
  });
  return lamePromise;
}
// mp3 кодується у фоновому потоці (Web Worker), щоб сторінка не підвисала
const MP3_WORKER = `
self.onmessage = e => {
  const { lameUrl, L, R, sr, kbps } = e.data;
  try {
    if (!self.lamejs) importScripts(lameUrl);
    const enc = new lamejs.Mp3Encoder(R ? 2 : 1, sr, kbps), out = [], B = 1152, STEP = B * 400, n = L.length;
    const toI16 = (src, a, b) => { const r = new Int16Array(b - a); for (let i = a; i < b; i++) { const v = Math.max(-1, Math.min(1, src[i])); r[i - a] = v < 0 ? v * 32768 : v * 32767; } return r; };
    for (let i = 0; i < n; i += STEP) {
      const e2 = Math.min(n, i + STEP), l = toI16(L, i, e2), r = R ? toI16(R, i, e2) : null;
      for (let j = 0; j < l.length; j += B) { const m = r ? enc.encodeBuffer(l.subarray(j, j + B), r.subarray(j, j + B)) : enc.encodeBuffer(l.subarray(j, j + B)); if (m.length) out.push(m); }
      self.postMessage({ progress: e2 / n });
    }
    const t = enc.flush(); if (t.length) out.push(t);
    self.postMessage({ done: true, blob: new Blob(out, { type: 'audio/mpeg' }) });
  } catch (err) { self.postMessage({ error: String(err) }); }
};`;
async function decodeAudio(file) {
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const ab = await new OAC(2, 1, 44100).decodeAudioData(await file.arrayBuffer());
  return {
    L: new Float32Array(ab.getChannelData(0)),
    R: ab.numberOfChannels > 1 ? new Float32Array(ab.getChannelData(1)) : null,
    sr: ab.sampleRate, dur: ab.length / ab.sampleRate,
  };
}
function mp3InWorker(L, R, sr, onProgress) {
  return new Promise((res, rej) => {
    let w;
    try { w = new Worker(URL.createObjectURL(new Blob([MP3_WORKER], { type: 'text/javascript' }))); } catch (e) { rej(e); return; }
    w.onmessage = e => {
      const d = e.data;
      if (d.progress != null) { if (onProgress) onProgress(d.progress); }
      else if (d.done) { w.terminate(); res(d.blob); }
      else if (d.error) { w.terminate(); rej(new Error(d.error)); }
    };
    w.onerror = e => { w.terminate(); rej(e); };
    w.postMessage({ lameUrl: new URL('vendor/lame.min.js', location.href).href, L, R, sr, kbps: CONFIG.VIDEO_KBPS });
  });
}
async function mp3OnMainThread(L, R, sr, onProgress) {
  await loadLame();
  const enc = new lamejs.Mp3Encoder(R ? 2 : 1, sr, CONFIG.VIDEO_KBPS), out = [], B = 1152, STEP = B * 240, n = L.length;
  const toI16 = (src, a, b) => { const r = new Int16Array(b - a); for (let i = a; i < b; i++) { const v = Math.max(-1, Math.min(1, src[i])); r[i - a] = v < 0 ? v * 32768 : v * 32767; } return r; };
  for (let i = 0; i < n; i += STEP) {
    const e = Math.min(n, i + STEP), l = toI16(L, i, e), r = R ? toI16(R, i, e) : null;
    for (let j = 0; j < l.length; j += B) { const m = r ? enc.encodeBuffer(l.subarray(j, j + B), r.subarray(j, j + B)) : enc.encodeBuffer(l.subarray(j, j + B)); if (m.length) out.push(m); }
    if (onProgress) onProgress(e / n);
    await sleep(0);
  }
  const tail = enc.flush(); if (tail.length) out.push(tail);
  return new Blob(out, { type: 'audio/mpeg' });
}
async function videoToMp3(file, onProgress) {
  const { L, R, sr, dur } = await decodeAudio(file);
  let blob;
  try { blob = await mp3InWorker(L, R, sr, onProgress); }
  catch (e) { console.warn('worker unavailable, encoding on main thread', e); blob = await mp3OnMainThread(L, R, sr, onProgress); }
  return { blob, dur };
}

async function driveDownload(id, onProgress) {
  const r = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media&supportsAllDrives=true&key=${CONFIG.GOOGLE_API_KEY}`);
  if (!r.ok) throw new Error('Drive ' + r.status);
  const total = +r.headers.get('content-length') || 0;
  if (!r.body || !total) return r.blob();
  const reader = r.body.getReader(), chunks = []; let got = 0;
  for (;;) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); got += value.length; if (onProgress) onProgress(got / total); }
  return new Blob(chunks);
}

/* ---------- перенесення на інший компʼютер: один файл .party ---------- */
const PACK_MAGIC = 'T2K1', PACK_NAME = 'ty-z-2000-x.party';
async function buildPack() {
  const metas = [], parts = [];
  for (const s of S.songs) {
    const b = await Store.get('song:' + s.id); if (!b) continue;
    metas.push({ file: s.file, title: s.title, dur: s.dur, start: s.start || 0, fromVideo: !!s.fromVideo, driveId: s.driveId || null, type: b.type || 'audio/mpeg', size: b.size });
    parts.push(b);
  }
  const head = new TextEncoder().encode(JSON.stringify({ app: 'ty-z-2000-x', v: 1, settings: S.settings, players: S.players.map(p => p.name), songs: metas }));
  const len = new Uint8Array(4); new DataView(len.buffer).setUint32(0, head.length, true);
  return new Blob([new TextEncoder().encode(PACK_MAGIC), len, head, ...parts], { type: 'application/octet-stream' });
}
async function readPack(file) {
  if (new TextDecoder().decode(await file.slice(0, 4).arrayBuffer()) !== PACK_MAGIC) throw new Error('not a pack');
  const len = new DataView(await file.slice(4, 8).arrayBuffer()).getUint32(0, true);
  const head = JSON.parse(new TextDecoder().decode(await file.slice(8, 8 + len).arrayBuffer()));
  let off = 8 + len;
  const songs = head.songs.map(m => { const blob = file.slice(off, off + m.size, m.type); off += m.size; return { ...m, blob }; });
  return { head, songs };
}
async function importPack(file) {
  if (busyAdding) return;
  busyAdding = true; setupMsg = { text: '📂 Відкриваю файл гри...', live: true }; if (S.screen === 'setup') render();
  try {
    const { head, songs } = await readPack(file);
    let added = 0, skipped = 0;
    for (const m of songs) {
      if (S.songs.some(s => (m.driveId && s.driveId === m.driveId) || (s.file === m.file && Math.abs(s.dur - m.dur) < 0.5))) { skipped++; continue; }
      const id = uid();
      await Store.put('song:' + id, new Blob([await m.blob.arrayBuffer()], { type: m.type }));
      S.songs.push({ id, file: m.file, title: m.title, dur: m.dur, start: m.start || 0, fromVideo: !!m.fromVideo, ...(m.driveId ? { driveId: m.driveId } : {}) });
      added++; save();
      const el = $('#addStatus'); if (el) el.textContent = `📂 Додаю пісні з файлу: ${added + skipped} з ${songs.length}`;
    }
    (head.players || []).forEach(n => { if (!S.players.some(p => p.name === n)) S.players.push({ id: uid(), name: n }); });
    if (head.settings) Object.assign(S.settings, { bday: head.settings.bday || S.settings.bday, clipSec: head.settings.clipSec ?? S.settings.clipSec, showAnswer: !!head.settings.showAnswer });
    save();
    setupMsg = { text: `✓ З файлу додано пісень: ${added}${skipped ? ` (ще ${skipped} вже були)` : ''}. Гравців: ${S.players.length}.` };
  } catch (e) {
    console.warn(e);
    setupMsg = { text: 'Це не файл гри 🤔 Потрібен файл .party, збережений кнопкою «Зберегти все у файл».', warn: true };
  }
  busyAdding = false;
  if (S.screen === 'setup') render();
}

async function runQueue(items, doneText) {
  busyAdding = true;
  const total = items.length, bad = [], prog = new Map(); let done = 0, added = 0;
  const status = () => {
    const act = [...prog.entries()].map(([n, p]) => `${p.icon} «${n}» ${Math.round(p.v * 100)}%`).join(' · ');
    const t = `${total > 1 ? `Готово ${done} з ${total}. ` : ''}${act || '💿 Додаю...'}`;
    setupMsg = { text: t, live: true };
    const el = $('#addStatus'); if (el) el.textContent = t; else if (S.screen === 'setup') render();
  };
  const one = async it => {
    let blob = null, dur = 0, fromVideo = false;
    try {
      prog.set(it.name, { icon: it.driveId ? '⬇️' : '💿', v: 0 }); status();
      const f = await it.load(v => { prog.set(it.name, { icon: '⬇️', v }); status(); });
      if (fileKind(f) === 'video') {
        prog.set(it.name, { icon: '🎬', v: 0 }); status();
        const r = await videoToMp3(f, v => { prog.set(it.name, { icon: '🎬', v }); status(); });
        blob = r.blob; dur = r.dur; fromVideo = true;
      } else { blob = f; dur = await probeDuration(f); }
    } catch (e) { console.warn(e); dur = 0; }
    prog.delete(it.name);
    if (!dur) bad.push(it.name);
    else {
      const id = uid();
      await Store.put('song:' + id, blob);
      S.songs.push({ id, file: it.name, title: it.name.replace(/\.[^.]+$/, '').replace(/_+/g, ' ').trim(), dur, start: 0, fromVideo, ...(it.driveId ? { driveId: it.driveId } : {}) });
      added++; save();
      const ul = $('#songs'); if (S.screen === 'setup' && ul) ul.innerHTML = songRows();
    }
    done++; status();
  };
  status();
  const queue = items.slice(), lanes = Math.max(1, Math.min(2, (navigator.hardwareConcurrency || 2) - 1));
  await Promise.all(Array.from({ length: lanes }, async () => { while (queue.length) await one(queue.shift()); }));
  busyAdding = false;
  setupMsg = bad.length
    ? { text: `${doneText}: ${added}. Не вдалося відкрити: ${bad.join(', ')}`, warn: true }
    : { text: `✓ ${doneText}: ${added}` };
  if (S.screen === 'setup') render();
}
async function addFiles(files) {
  if (busyAdding) return;
  const packs = [...files].filter(f => /\.party$/i.test(f.name));
  for (const p of packs) await importPack(p);
  const list = [...files].filter(f => fileKind(f));
  if (!list.length) {
    if (!packs.length) { setupMsg = { text: 'Це не схоже на аудіо чи відео 🤔 Потрібні mp3 / m4a / wav або mp4 / mov.', warn: true }; render(); }
    return;
  }
  await runQueue(list.map(f => ({ name: f.name, load: async () => f })), 'Додано пісень');
}
async function syncDrive() {
  if (busyAdding) return;
  const fid = driveFolderId(S.settings.driveUrl);
  const fail = text => { setupMsg = { text, warn: true }; render(); };
  if (!fid) return fail('Встав посилання на папку Google Drive (вигляду drive.google.com/drive/folders/...)');
  if (!CONFIG.GOOGLE_API_KEY) return fail('⚠ Доступ до Google Drive ще не налаштований (потрібен API-ключ).');
  setupMsg = { text: '☁️ Дивлюсь, що є в папці...', live: true }; render();
  let files;
  try { files = await driveList(fid); } catch (e) { console.warn(e); return fail('Не вдалося відкрити папку 🤔 Перевір посилання і що доступ «Усі, хто має посилання».'); }
  const media = files.filter(f => fileKind({ type: f.mimeType || '', name: f.name }));
  const fresh = media.filter(f => !S.songs.some(s => s.driveId === f.id));
  if (!media.length) return fail('У папці поки немає пісень (mp3, m4a, wav, mp4, mov) або вона не відкрита за посиланням.');
  if (!fresh.length) { setupMsg = { text: `✓ Усі пісні з папки вже в грі (${media.length})` }; render(); return; }
  await runQueue(fresh.map(f => ({
    name: f.name, driveId: f.id,
    load: onProg => driveDownload(f.id, onProg).then(b => new File([b], f.name, { type: f.mimeType || b.type })),
  })), 'З Google Drive додано пісень');
}

function computeResults() {
  const rounds = Object.values(S.game ? S.game.rounds : {}).filter(r => r.played || r.knew.length);
  const res = S.players.map(p => {
    let tot = 0, k = 0;
    rounds.forEach(r => { if (r.participants.includes(p.id)) { tot++; if (r.knew.includes(p.id)) k++; } });
    return { p, tot, k, pct: tot ? Math.round(100 * k / tot) : 0 };
  }).sort((a, b) => b.pct - a.pct || b.k - a.k || a.p.name.localeCompare(b.p.name, 'uk'));
  const levels = [...new Set(res.map(r => r.pct))];
  res.forEach(r => { r.place = levels.indexOf(r.pct) + 1; });
  return { res, rounds: rounds.length };
}

      ${input ? `<input class="dlg-in" maxlength="24" placeholder="${esc(input)}">` : ''}
      <div class="dlg-btns"><button class="btn sm silver" data-r="0">${esc(cancel)}</button><button class="btn sm" data-r="1">${esc(ok)}</button></div></div></div>`;
    document.body.appendChild(m);
    const inp = $('.dlg-in', m); if (inp) setTimeout(() => inp.focus(), 30);
    const close = v => { m.remove(); res(v); };
    m.addEventListener('click', e => {
      const b = e.target.closest('[data-r]');
      if (b) close(b.dataset.r === '1' ? (inp ? inp.value.trim() : true) : (inp ? null : false));
      else if (e.target === m) close(inp ? null : false);
    });
    (inp || m).addEventListener('keydown', e => {
      if (e.key === 'Enter' && inp) close(inp.value.trim());
      if (e.key === 'Escape') close(inp ? null : false);
    });
  });
}

/* ---------- navigation ---------- */
async function gotoRound(n, intro) {
  if (navBusy) return; navBusy = true;
  try {
    const fading = Audio2k.fadeStop(intro ? CONFIG.FADE_SEC * 1000 : 600);
    const ov = intro ? Overlay.song(n) : null;
    await fading;
    S.game.idx = n; S.screen = 'round'; save(); render(); window.scrollTo(0, 0);
    if (ov) await ov;
  } finally { navBusy = false; }
}
async function finishGame() {
  if (navBusy) return; navBusy = true;
  try {
    const f = Audio2k.fadeStop();
    const ov = Overlay.gameOver();
    await f;
    S.game.finished = true; S.screen = 'results'; save(); render(); window.scrollTo(0, 0);
    await ov;
  } finally { navBusy = false; }
}

/* ---------- actions ---------- */
const ACTS = {
  async home() { await Audio2k.fadeStop(600); previewId = null; go('title'); },
  setup() { setupMsg = null; go('setup'); },
  start() { go(S.songs.length ? 'players' : 'setup'); },
  resume() { go('round'); },
  results() { go('results'); },
  toPlayers() { Audio2k.stop(600); go('players'); },
  again() { go('players'); },
  icon(b) { b.classList.remove('hop'); void b.offsetWidth; b.classList.add('hop'); b.addEventListener('animationend', () => b.classList.remove('hop'), { once: true }); },

  async preview(b) {
    const id = b.dataset.id;
    if (previewId === id) { Audio2k.stop(); return; }
    await Audio2k.fadeStop(300);
    const s = songById(id); const blob = s && await Store.get('song:' + id);
    if (!blob) { setupMsg = { text: 'Файл не знайдено 🤔 Видали і додай його знову.', warn: true }; render(); return; }
    try { await Audio2k.load(`prev:${id}:${s.start || 0}:${S.settings.clipSec}`, blob, s.start, +S.settings.clipSec); }
    catch (e) { setupMsg = { text: 'Не вдалося відкрити файл', warn: true }; render(); return; }
    previewId = id; refreshPreviewBtns(); Audio2k.play();
  },
  async delSong(b) {
    const id = b.dataset.id;
    if (previewId === id) { await Audio2k.fadeStop(300); }
    S.songs = S.songs.filter(s => s.id !== id); save(); await Store.del('song:' + id);
    setupMsg = null; render();
  },
  async clearSongs() {
    if (!await modal({ title: 'Видалити всі?', text: `Видалити всі ${S.songs.length} пісень зі списку?`, ok: 'Видалити' })) return;
    await Audio2k.fadeStop(300);
    for (const s of S.songs) await Store.del('song:' + s.id);
    S.songs = []; save(); setupMsg = null; render();
  },

  async exportPack() {
    setupMsg = { text: '💾 Готую файл...', live: true }; render();
    const blob = await buildPack();
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = PACK_NAME;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    setupMsg = { text: `✓ Збережено файл «${PACK_NAME}» (${(blob.size / 1048576).toFixed(1)} МБ) у Завантаження. Перенеси його на інший компʼютер і відкрий там кнопкою «📂 Відкрити файл гри».` };
    render();
  },
  importPick() { const pi = $('#packIn'); if (pi) pi.click(); },
  syncDrive() { syncDrive(); },

  delPlayer(b) { S.players = S.players.filter(p => p.id !== b.dataset.pid); save(); render(); },
  async startGame() {
    const g = S.game;
    if (g && !g.finished && Object.values(g.rounds).some(r => r.played || r.knew.length)) {
      if (!await modal({ title: 'Нова гра?', text: 'Попередня гра ще не закінчена. Почати заново? Її відмітки зітруться.', ok: 'Так, заново' })) return;
    }
    S.game = { order: shuffled(S.songs.map(s => s.id)), idx: 0, rounds: {}, finished: false };
    save();
    gotoRound(0, true);
  },

  playToggle() {
    const st = Audio2k.state();
    if (st === 'playing') Audio2k.pause();
    else if (st === 'ready' || st === 'paused') {
      Audio2k.play();
      const r = S.game && S.game.rounds[S.game.idx];
      if (r && !r.played) { r.played = true; save(); }
    }
  },
  stopSong() { Audio2k.stop(); },
  toggle(b) {
    const r = S.game.rounds[S.game.idx]; const id = b.dataset.pid;
    const k = r.knew.indexOf(id); if (k >= 0) r.knew.splice(k, 1); else r.knew.push(id);
    updateBubbles(r, [id]);
  },
  allKnow() {
    const r = S.game.rounds[S.game.idx];
    const ids = S.players.filter(p => r.participants.includes(p.id)).map(p => p.id);
    const allIn = ids.every(id => r.knew.includes(id));
    const changed = ids.filter(id => r.knew.includes(id) === allIn);
    r.knew = allIn ? [] : ids;
    updateBubbles(r, changed, true);
  },
  async addPlayer() {
    const name = await modal({ title: 'Новий гравець', text: 'Хто приєднався до гри?', input: 'Імʼя', ok: 'Додати' });
    if (!name) return;
    const p = { id: uid(), name }; S.players.push(p);
    const r = S.game.rounds[S.game.idx]; if (r) r.participants.push(p.id);
    updateBubbles(r, [p.id]); toast(name);
  },
  reveal() {
    const el = $('#reveal'); const s = songById(S.game.order[S.game.idx]);
    if (!el.classList.contains('hide')) { el.classList.add('hide'); el.textContent = ''; return; }
    el.textContent = '🎵 ' + (s ? s.title : '?'); el.classList.remove('hide');
  },
  prev() { gotoRound(S.game.idx - 1, false); },
  next() { S.game.idx >= S.game.order.length - 1 ? finishGame() : gotoRound(S.game.idx + 1, true); },
  async endEarly() {
    if (!await modal({ title: 'Завершити гру?', text: 'Завершити зараз і показати результати за зіграні пісні?', ok: 'Так, до фіналу' })) return;
    finishGame();
  },
};
function updateBubbles(r, changedIds, fire) {
  save();
  $('#bubbles').innerHTML = bubblesHtml(r);
  changedIds.forEach((id, n) => { const el = $(`#bubbles [data-pid="${id}"]`); if (el) setTimeout(() => el.classList.add('pop'), fire ? n * 70 : 0); });
  if (fire) { const f = $('#bubbles .fire'); if (f) f.classList.add('pop'); }
}
function refreshPreviewBtns() {
  $$('[data-act="preview"]').forEach(b => { const on = b.dataset.id === previewId; b.classList.toggle('on', on); b.textContent = on ? '■' : '▶'; });
}
Audio2k.on(st => { if (st === 'ready' && previewId && S.screen === 'setup') { previewId = null; refreshPreviewBtns(); } });

/* ---------- events ---------- */
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  Audio2k.unlock();
  const fn = ACTS[b.dataset.act]; if (fn) fn(b, e);
});
document.addEventListener('click', e => {
  if (!e.clientX && !e.clientY) return;
  const b = e.target.closest('.btn,.chip,.rb,.dicon,.ib,.linkbtn,.bub');
  if (b && !b.disabled && !b.classList.contains('static')) burst(e.clientX, e.clientY);
}, true);
document.addEventListener('pointerdown', () => Audio2k.unlock(), { passive: true });
addEventListener('keydown', e => {
  if (e.code !== 'Space' || S.screen !== 'round' || document.querySelector('.modal')) return;
  const tag = (document.activeElement || {}).tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  e.preventDefault(); ACTS.playToggle();
});
['dragover', 'drop'].forEach(t => addEventListener(t, e => {
  e.preventDefault();
  if (t === 'drop' && S.screen === 'setup' && e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
}));

/* ---------- visualizer (Winamp spectrum) + beat pulse ---------- */
const Viz = (() => {
  let cv = null, cx = null, beat = 0, lastBeat = -1; const N = 32; const bars = new Array(N).fill(0), peaks = new Array(N).fill(0);
  function attach(c) { cv = c; if (!cv) return; cx = cv.getContext('2d'); size(); }
  function size() {
    if (!cv) return; const r = cv.getBoundingClientRect(); const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.max(10, Math.round(r.width * dpr)); cv.height = Math.max(10, Math.round(r.height * dpr));
  }
  function draw(now) {
    const W = cv.width, H = cv.height; cx.clearRect(0, 0, W, H);
    const st = Audio2k.state();
    const data = (st === 'playing' || st === 'pausing' || st === 'stopping') ? Audio2k.freq() : null;
    let bass = 0;
    for (let i = 0; i < N; i++) {
      let v;
      if (data) { const idx = 1 + Math.floor(Math.pow(i / N, 1.7) * (data.length * 0.8)); v = data[idx] / 255; if (i < 4) bass += v / 4; }
      else v = 0.07 + 0.05 * Math.sin(now / 420 + i * .45);   // screensaver-хвиля, коли тиша
      bars[i] = Math.max(v, bars[i] * 0.88);
      peaks[i] = Math.max(bars[i], peaks[i] - 0.01);
    }
    beat = Math.max(bass * bass * 1.3, beat * 0.9);
    const gap = W / N * 0.24, bw = W / N - gap, seg = Math.max(4, H / 20);
    const grd = cx.createLinearGradient(0, H, 0, 0);
    grd.addColorStop(0, '#4b1dc8'); grd.addColorStop(.55, '#8a5cff'); grd.addColorStop(.85, '#49d6ff'); grd.addColorStop(1, '#e6fbff');
    for (let i = 0; i < N; i++) {
      const x = i * (bw + gap) + gap / 2, h = bars[i] * H;
      cx.fillStyle = 'rgba(138,92,255,.12)'; cx.fillRect(x, H - seg + 2, bw, seg - 2);
      cx.fillStyle = grd;
      for (let y = H; y > H - h; y -= seg) cx.fillRect(x, y - seg + 2, bw, seg - 2);
      if (peaks[i] > 0.02) { cx.fillStyle = '#ffffff'; cx.fillRect(x, H - peaks[i] * H - 3, bw, 3); }
    }
    const rs = $('.round-scr');
    if (rs && Math.abs(beat - lastBeat) > 0.004) { rs.style.setProperty('--beat', beat.toFixed(3)); lastBeat = beat; }
  }
  (function loop(now) {
    requestAnimationFrame(loop);
    if (cv && cv.isConnected) draw(now || 0);
    ampTick();
  })();
  addEventListener('resize', size);
  return { attach };
})();

/* ---------- confetti ---------- */
function confetti(ms = 5000) {
  const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = c.width = innerWidth * dpr, H = c.height = innerHeight * dpr, x = c.getContext('2d');
  const cols = ['#8a5cff', '#c3a8ff', '#6a35f0', '#49d6ff', '#ffffff', '#ffd54a', '#9be83a'];
  const P = Array.from({ length: 170 }, () => ({
    x: Math.random() * W, y: -Math.random() * H * 0.7, vx: (Math.random() - .5) * 2 * dpr, vy: (2 + Math.random() * 3) * dpr,
    r: (4 + Math.random() * 6) * dpr, a: Math.random() * 6, va: (Math.random() - .5) * .2,
    c: cols[Math.random() * cols.length | 0], star: Math.random() < .35,
  }));
  const t0 = performance.now();
  (function f(t) {
    const el = t - t0; x.clearRect(0, 0, W, H);
    x.globalAlpha = el > ms - 900 ? Math.max(0, (ms - el) / 900) : 1;
    P.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.a += p.va;
      if (p.y > H + 20 && el < ms - 1800) { p.y = -20; p.x = Math.random() * W; }
      x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c;
      if (p.star) { x.font = `${p.r * 2.6}px sans-serif`; x.fillText('✦', -p.r, p.r); }
      else x.fillRect(-p.r / 2, -p.r * .6, p.r, p.r * 1.2);
      x.restore();
    });
    if (el < ms) requestAnimationFrame(f); else c.remove();
  })(t0);
}

/* ---------- decor: stars, bubbles, parallax, cursor sparkles ---------- */
(function stars() {
  let h = '';
  for (let i = 0; i < 70; i++) {
    const x = (Math.random() * 100).toFixed(2), y = (Math.random() * 100).toFixed(2), s = (Math.random() * 2 + 1).toFixed(1);
    const d = (Math.random() * 4).toFixed(2), du = (2 + Math.random() * 3).toFixed(2);
    h += Math.random() < .12
      ? `<b style="left:${x}%;top:${y}%;animation-delay:${d}s;animation-duration:${du}s">✦</b>`
      : `<i style="left:${x}%;top:${y}%;width:${s}px;height:${s}px;animation-delay:${d}s;animation-duration:${du}s"></i>`;
  }
  $('#stars').innerHTML = h;
})();
(function orbs() {
  let h = '';
  for (let i = 0; i < 12; i++) {
    const size = 30 + Math.random() * 90, d = 18 + Math.random() * 22;
    h += `<i style="left:${(Math.random() * 100).toFixed(1)}%;width:${size | 0}px;height:${size | 0}px;--d:${d.toFixed(1)}s;--dl:${(-Math.random() * d).toFixed(1)}s;--sx:${(Math.random() * 80 - 40) | 0}px;--c:${Math.random() < .6 ? '138,92,255' : '73,214,255'}"></i>`;
  }
  $('#orbs').innerHTML = h;
})();
(function pointerFx() {
  let raf = 0, mx = 0, my = 0, last = 0;
  const fine = matchMedia('(pointer:fine)').matches;
  addEventListener('pointermove', e => {
    mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5;
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; const b = document.body.style; b.setProperty('--mx', mx.toFixed(3)); b.setProperty('--my', my.toFixed(3)); });
    if (!fine) return;
    const t = performance.now(); if (t - last < 40) return; last = t;
    const s = document.createElement('span'); s.className = 'spark'; s.textContent = Math.random() < .5 ? '✦' : '✧';
    s.style.left = e.clientX + 'px'; s.style.top = e.clientY + 'px';
    s.style.color = SPARK_COLS[Math.random() * SPARK_COLS.length | 0]; s.style.fontSize = (10 + Math.random() * 10) + 'px';
    document.body.appendChild(s); setTimeout(() => s.remove(), 820);
  }, { passive: true });
})();

/* ---------- boot ---------- */
if ((S.screen === 'round' || S.screen === 'results') && !S.game) S.screen = 'title';
Store.probe().then(() => { try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {} render(); });
